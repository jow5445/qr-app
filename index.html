<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>QR Code Generator</title>
<style>
    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #31473a;
        font: 14px Arial
    }

    .c {
        width: 500px;
        padding: 30px 40px;
        text-align: center;
        background: #edf4f2;
        border-radius: 15px;
        box-shadow: 0 10px 25px #0004
    }

    h1 {
        color: #31473a;
        margin: 0 0 10px;
        font-size: 26px
    }

    p {
        color: #555;
        font-weight: 500;
        margin: 10px 0 20px
    }

    input {
        width: 100%;
        height: 50px;
        padding: 10px;
        margin: 10px 0 20px;
        border: 2px solid #31473a;
        border-radius: 8px;
        font-size: 16px;
        outline: 0
    }

    input:focus {
        border-color: #000
    }

    .g {
        display: flex;
        gap: 10px
    }

    button {
        flex: 1;
        height: 50px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer
    }

    #g {
        background: #31473a
    }

    #g:hover {
        background: #25382d
    }

    #c {
        background: #dc3545
    }

    #c:hover {
        background: #c82333
    }

    #q {
        width: 200px;
        max-height: 0;
        margin: auto;
        overflow: hidden;
        border-radius: 8px;
        transition: .5s
    }

    #q img {
        width: 100%;
        padding: 10px
    }

    #q.s {
        max-height: 300px;
        border: 1px solid #d1d1d1
    }

    #d {
        width: 100%;
        margin-top: 15px;
        background: #28a745;
        display: none
    }

    #d:hover {
        background: #218838
    }

    #s {
        margin: 10px 0
    }

    .e {
        color: #dc3545 !important;
        border-color: #dc3545 !important
    }
</style>
<div class=c>
    <h1>QR code Generator</h1>
    <p>Enter your text or URL to generate a QR Code</p><input id=i placeholder="Enter your URL or text here...">
    <div class=g><button id=g>Generate QR Code</button><button id=c>Clear</button></div>
    <p id=s></p>
    <div id=q><img id=x></div><button id=d>Download QR Code</button>
</div>
<script>
    i.onkeydown = e => e.key == "Enter" && G(); g.onclick = G; c.onclick = () => { i.value = ""; i.focus(); q.classList.remove("s"); d.style.display = "none"; x.src = ""; s.textContent = "" }; d.onclick = () => { let a = document.createElement("a"); a.href = x.src; a.download = "QRCode_" + Date.now() + ".png"; a.click() }; i.focus();
    async function G() { let v = i.value.trim(); if (!v) return E("Please enter a value to generate a QR code."); if (v.length > 500) return E("Input value is too long. Please enter a shorter value."); g.disabled = 1; g.textContent = "Generating QR code..."; s.textContent = "Generating QR code..."; try { x.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(v); await new Promise((r, j) => { x.onload = r; x.onerror = j }); q.classList.add("s"); d.style.display = "block"; s.textContent = "QR code generated successfully!" } catch (e) { E("Failed to generate QR code. Please try again.") } g.disabled = 0; g.textContent = "Generate QR Code" } function E(m) { s.textContent = m; s.classList.add("e"); i.classList.add("e"); setTimeout(() => { s.classList.remove("e"); i.classList.remove("e") }, 3e3) }
</script>
